repos:
  - repo: local
    hooks:
      - id: format
        name: oxfmt
        entry: bun run format:check
        language: system
        pass_filenames: false
      - id: lint
        name: oxlint
        entry: bun run lint
        language: system
        pass_filenames: false
      - id: check
        name: full check
        entry: bun run check
        language: system
        pass_filenames: false
        stages: [pre-push]
